---
layout: mycopunk
---
<a class="back" href="{{ '/mycopunk/' | relative_url }}">&larr; All patch notes</a>

<article>
  <header class="note-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  {{ content }}
</article>
