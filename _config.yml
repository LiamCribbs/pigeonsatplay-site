title: pigeonsatplay

# Patch notes live in _patch_notes/ as markdown files. Each one is published
# at /mycopunk/<filename>/ and listed on /mycopunk/.
collections:
  patch_notes:
    output: true
    permalink: /mycopunk/:name/
  # Saxon lore entries live in _lore/ as markdown files. They don't get pages
  # of their own; saxon/lore-data.js bundles them for the archive terminal.
  lore:
    output: false

defaults:
  - scope:
      type: patch_notes
    values:
      layout: patch-note
